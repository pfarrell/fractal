[package]
name = "fractal-explorer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "fractal"
path = "src/main.rs"

[dependencies]
dirs = "7.0.0"
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
num-complex = { version = "0.4.6", features = ["serde"] }
rand = "0.10.3"
rayon = "1.12.0"
rfd = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tempfile = "3.27.0"
ureq = "3"

[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2
