name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag format
        run: |
          echo "$GITHUB_REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            || { echo "tag must be vMAJOR.MINOR.PATCH, got $GITHUB_REF_NAME"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Linux GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: fmt, clippy, tests
        run: make check

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: fractal-darwin-arm64
          - runner: macos-latest
            target: x86_64-apple-darwin
            asset: fractal-darwin-amd64
          # The oldest supported Ubuntu runners: glibc 2.35, so the
          # binaries also run on Debian 12 and Ubuntu 22.04.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: fractal-linux-amd64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: fractal-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Build
        env:
          FRACTAL_VERSION: ${{ github.ref_name }}
        run: |
          cargo build --release --locked --bin fractal --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/fractal ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: (cd dist && sha256sum fractal-* > checksums.txt && cat checksums.txt)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
